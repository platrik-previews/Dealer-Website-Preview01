name: Materialize email signature asset on branch

on:
  push:
    branches: [email-signature-asset]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact signature PNG
        shell: bash
        run: |
          mkdir -p public/assets
          sed -n '/^iVBOR/,/^B64$/p' .github/workflows/materialize-email-signature.yml | sed '$d' | tr -d '\n' | base64 --decode > public/assets/uzair-email-signature.png
          test "$(sha256sum public/assets/uzair-email-signature.png | awk '{print $1}')" = "c9fe2a6bb153346248519e47f1e7d08123c056c37c2b2afe66bdbf97b05bad0e"
      - name: Commit signature asset
        shell: bash
        run: |
          git add public/assets/uzair-email-signature.png
          if git diff --cached --quiet; then
            echo "Signature asset already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add exact Uzair email signature asset"
          git push origin HEAD:email-signature-asset
