name: Patch React global binding in Resin bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Bind imported React module for historical App chunk
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/resin/assets/App-DFtM7B0N.js')
          source = path.read_text()
          original = 'import{r as v}from"./index-DaTgjokv.js";'
          replacement = 'import{r as v}from"./index-DaTgjokv.js";const React=v;'
          if replacement in source:
              print('React binding already present.')
          elif original in source:
              source = source.replace(original, replacement, 1)
              path.write_text(source)
          else:
              raise RuntimeError('Expected historical React import was not found.')
          if 'const React=v;' not in path.read_text() or 'React.createElement' not in path.read_text():
              raise RuntimeError('React global binding repair did not validate.')
          PY

      - name: Commit bundle repair
        run: |
          git config user.name 'platrik-preview-bot'
          git config user.email 'preview-bot@users.noreply.github.com'
          git add public/resin/assets/App-DFtM7B0N.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bind React in recovered Resin App chunk'
          git push origin HEAD:${{ github.head_ref }}
