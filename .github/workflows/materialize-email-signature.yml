name: Materialize email signature asset

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-email-signature.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Create exact signature PNG
        shell: bash
        run: |
          mkdir -p public/assets
          cat > /tmp/signature.b64 <<'B64'

B64
          base64 --decode /tmp/signature.b64 > public/assets/uzair-email-signature.png
          test "$(sha256sum public/assets/uzair-email-signature.png | awk '{print $1}')" = "c9fe2a6bb153346248519e47f1e7d08123c056c37c2b2afe66bdbf97b05bad0e"
      - name: Commit signature asset
        shell: bash
        run: |
          if git diff --quiet -- public/assets/uzair-email-signature.png; then
            echo "Signature asset already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/uzair-email-signature.png
          git commit -m "Add exact Uzair email signature asset"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
