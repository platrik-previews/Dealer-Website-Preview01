name: Import current Resin build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Download verified current master-template artifact
        run: |
          curl --fail --location --silent --show-error 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-c378-820a-a2fb-c46804dd0524/raw?se=2026-07-28T08%3A19%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=df8d8079-7b42-556a-9f0a-20e446c7ac07&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-28T06%3A54%3A53Z&ske=2026-07-30T06%3A54%3A53Z&sks=b&skv=2026-02-06&sig=Nj95l7Xm%2Bijk5D80ImTUk7RIpyVY0xt%2FgaYezrapEBg%3D' -o /tmp/current-resin.zip
          rm -rf /tmp/current-resin
          mkdir -p /tmp/current-resin
          unzip -q /tmp/current-resin.zip -d /tmp/current-resin
      - name: Install uniquely versioned current assets
        run: |
          set -euo pipefail
          app_source="$(find /tmp/current-resin/assets -maxdepth 1 -name 'App-*.js' -print -quit)"
          runtime_source="$(find /tmp/current-resin/assets -maxdepth 1 -name 'index-*.js' -print -quit)"
          css_source="$(find /tmp/current-resin/assets -maxdepth 1 -name 'index-*.css' -print -quit)"
          test -n "$app_source" && test -n "$runtime_source" && test -n "$css_source"
          grep -q 'A driveway should feel' "$app_source"
          grep -q 'Beautiful above.' "$app_source"
          mkdir -p public/resin/assets
          sed 's/index-DaTgjokv.js/index-current-20260728.js/g' "$app_source" > public/resin/assets/App-current-20260728.js
          sed 's/App-DFtM7B0N.js/App-current-20260728.js/g' "$runtime_source" > public/resin/assets/index-current-20260728.js
          cp "$css_source" public/resin/assets/index-current-20260728.css
          cp /tmp/current-resin/assets/favicon-09JzxaOU.svg public/resin/assets/favicon-09JzxaOU.svg
          sed -e 's/index-DaTgjokv.js/index-current-20260728.js/g' -e 's/index-B01mJXAv.css/index-current-20260728.css/g' /tmp/current-resin/index.html > public/resin/index.html
          grep -q 'index-current-20260728.js' public/resin/index.html
          grep -q 'App-current-20260728.js' public/resin/assets/index-current-20260728.js
          grep -q 'index-current-20260728.js' public/resin/assets/App-current-20260728.js
      - name: Commit current renderer assets
        run: |
          git config user.name 'platrik-preview-bot'
          git config user.email 'preview-bot@users.noreply.github.com'
          git add public/resin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Replace stale Resin bundle with current master template'
          git push origin HEAD:${{ github.head_ref }}
