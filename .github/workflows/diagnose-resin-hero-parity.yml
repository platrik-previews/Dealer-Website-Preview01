name: Diagnose Resin hero parity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture live source files
        run: |
          set -u
          curl -L --fail --silent --show-error 'https://resin-driveaway.pages.dev/?source=1' -o cloudflare-live.html || true
          curl -L --fail --silent --show-error 'https://platrik-preview-hub.vercel.app/resin/index.html?source=1' -o preview-hub-resin.html || true
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for prefix, file, base in [
            ('cloudflare', 'cloudflare-live.html', 'https://resin-driveaway.pages.dev/'),
            ('hub', 'preview-hub-resin.html', 'https://platrik-preview-hub.vercel.app/resin/'),
          ]:
            path = Path(file)
            if not path.exists():
              continue
            html = path.read_text(errors='replace')
            for kind, pattern in [('css', r'href=["\']([^"\']+\.css[^"\']*)'), ('js', r'src=["\']([^"\']+\.js[^"\']*)')]:
              matches = re.findall(pattern, html)
              for index, value in enumerate(matches):
                if value.startswith('http'):
                  url = value
                elif value.startswith('/'):
                  from urllib.parse import urljoin
                  url = urljoin(base, value)
                else:
                  from urllib.parse import urljoin
                  url = urljoin(base, value)
                subprocess.run(['curl','-L','--fail','--silent','--show-error',url,'-o',f'{prefix}-{kind}-{index}.txt'], check=False)
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Compare Cloudflare and Preview Hub hero motion
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          const report = { cloud: {}, hub: {}, errors: [] };
          const positions = [0, 0.15, 0.32, 0.52, 0.72, 0.9];

          async function inspectFrame(frame, label) {
            const base = await frame.evaluate(() => ({
              url: location.href,
              title: document.title,
              readyState: document.readyState,
              bodyText: document.body?.innerText?.slice(0, 500) || '',
              bodyHeight: document.body?.scrollHeight || 0,
              viewportHeight: innerHeight,
              heroExists: Boolean(document.querySelector('[data-hero]')),
              reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
              scriptSources: [...document.scripts].map((s) => s.src || 'inline'),
              styleSources: [...document.querySelectorAll('link[rel="stylesheet"]')].map((l) => l.href),
            }));
            const snapshots = [];
            if (base.heroExists) {
              for (const ratio of positions) {
                snapshots.push(await frame.evaluate(async (ratio) => {
                  const hero = document.querySelector('[data-hero]');
                  const scrollable = Math.max(1, hero.offsetHeight - innerHeight);
                  scrollTo(0, Math.round(scrollable * ratio));
                  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                  const heroStyle = getComputedStyle(hero);
                  const pick = (selector) => {
                    const node = document.querySelector(selector);
                    if (!node) return null;
                    const style = getComputedStyle(node);
                    return { opacity: style.opacity, transform: style.transform, visibility: style.visibility, display: style.display };
                  };
                  return {
                    ratio,
                    scrollY,
                    progress: heroStyle.getPropertyValue('--hero-progress').trim(),
                    intro: heroStyle.getPropertyValue('--hero-intro').trim(),
                    explode: heroStyle.getPropertyValue('--hero-explode').trim(),
                    build: heroStyle.getPropertyValue('--hero-build').trim(),
                    finish: heroStyle.getPropertyValue('--hero-finish').trim(),
                    final: heroStyle.getPropertyValue('--hero-final').trim(),
                    classes: hero.className,
                    opening: pick('.hero-opening'),
                    scene: pick('.hero-scene'),
                    rig: pick('.driveway-rig'),
                    finalPanel: pick('.hero-final'),
                  };
                }, ratio));
              }
            }
            report[label] = { ...base, snapshots };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, reducedMotion: 'no-preference' });
            const cloud = await context.newPage();
            const hub = await context.newPage();
            for (const [label, page] of [['cloud', cloud], ['hub', hub]]) {
              page.on('console', (msg) => { if (msg.type() === 'error') report.errors.push(`${label}:console:${msg.text()}`); });
              page.on('pageerror', (error) => report.errors.push(`${label}:pageerror:${error.message}`));
            }

            try {
              await cloud.goto('https://resin-driveaway.pages.dev/?hero-parity=2', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await cloud.waitForTimeout(3000);
              await inspectFrame(cloud.mainFrame(), 'cloud');
              if (report.cloud.heroExists) {
                await cloud.mainFrame().evaluate(() => {
                  const hero = document.querySelector('[data-hero]');
                  scrollTo(0, (hero.offsetHeight - innerHeight) * 0.45);
                });
                await cloud.waitForTimeout(200);
                await cloud.screenshot({ path: 'cloudflare-hero-mid.png' });
              }
            } catch (error) {
              report.errors.push(`cloud:load:${error.message}`);
            }

            try {
              await hub.goto('https://platrik-preview-hub.vercel.app/stoneflow-resin/?hero-parity=2', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await hub.waitForTimeout(3000);
              const hubFrame = hub.frames().find((frame) => frame.url().includes('/resin/index.html'));
              if (!hubFrame) throw new Error('Resin iframe missing');
              await inspectFrame(hubFrame, 'hub');
              if (report.hub.heroExists) {
                await hubFrame.evaluate(() => scrollTo(0, 0));
                const box = await hub.locator('iframe').boundingBox();
                if (box) {
                  await hub.mouse.move(box.x + box.width / 2, box.y + Math.min(box.height / 2, 450));
                  await hub.mouse.wheel(0, 1500);
                  await hub.waitForTimeout(500);
                  report.hub.wheel = await hubFrame.evaluate(() => ({
                    scrollY,
                    progress: getComputedStyle(document.querySelector('[data-hero]')).getPropertyValue('--hero-progress').trim(),
                  }));
                }
                await hubFrame.evaluate(() => {
                  const hero = document.querySelector('[data-hero]');
                  scrollTo(0, (hero.offsetHeight - innerHeight) * 0.45);
                });
                await hub.waitForTimeout(200);
                await hub.screenshot({ path: 'preview-hub-hero-mid.png' });
              }
            } catch (error) {
              report.errors.push(`hub:load:${error.message}`);
            }

            fs.writeFileSync('hero-parity-report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report));
            await browser.close();
          })().catch((error) => {
            report.errors.push(`fatal:${error.message}`);
            fs.writeFileSync('hero-parity-report.json', JSON.stringify(report, null, 2));
            console.error(error);
          });
          NODE

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resin-hero-parity-evidence
          path: |
            hero-parity-report.json
            cloudflare-live.html
            preview-hub-resin.html
            cloudflare-*.txt
            hub-*.txt
            cloudflare-hero-mid.png
            preview-hub-hero-mid.png
          retention-days: 1
