name: Install original static Resin site

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download exact original static artifact
        run: |
          curl --fail --location --silent --show-error 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-d71c-8246-8370-aebdc0e46ef5/raw?se=2026-07-28T08%3A40%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=012e2472-e336-5bba-bd2e-74ef62e33700&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-28T06%3A26%3A13Z&ske=2026-07-30T06%3A26%3A13Z&sks=b&skv=2026-02-06&sig=SjDyhLGUH21L1e0JWfz6kCY%2BnywArRDN9g0ZcmpdnSU%3D' -o /tmp/original-static-resin.zip
          rm -rf /tmp/original-static-resin
          mkdir -p /tmp/original-static-resin
          unzip -q /tmp/original-static-resin.zip -d /tmp/original-static-resin

      - name: Restore exact static site and add runtime adapter
        run: |
          set -euo pipefail
          rm -rf public/resin/assets
          cp /tmp/original-static-resin/index.html public/resin/index.html
          cp /tmp/original-static-resin/styles.css public/resin/styles.css
          cp /tmp/original-static-resin/script.js public/resin/script.js
          cp /tmp/original-static-resin/favicon.svg public/resin/favicon.svg
          python - <<'PY'
          from pathlib import Path
          path = Path('public/resin/index.html')
          html = path.read_text()
          html = html.replace('<meta name="robots" content="index, follow" />', '<meta name="robots" content="noindex, nofollow, noarchive" />')
          html = html.replace('<link rel="icon" href="favicon.svg" type="image/svg+xml" />', '<link rel="icon" href="/resin/favicon.svg" type="image/svg+xml" />')
          html = html.replace('<link rel="stylesheet" href="styles.css" />', '<link rel="stylesheet" href="/resin/styles.css?v=static-original-20260728" />')
          html = html.replace('<script src="script.js" defer></script>', '<script src="/resin/runtime-config.js?v=static-original-20260728" defer></script>\n    <script src="/resin/script.js?v=static-original-20260728" defer></script>')
          path.write_text(html)
          PY
          grep -q 'A better first impression' public/resin/index.html
          grep -q 'BUILT IN LAYERS' public/resin/index.html
          grep -q '/resin/runtime-config.js' public/resin/index.html
          grep -q 'noindex, nofollow, noarchive' public/resin/index.html
          test -s public/resin/styles.css
          test -s public/resin/script.js
          test -s public/resin/runtime-config.js

      - name: Commit restored static renderer
        run: |
          git config user.name 'platrik-preview-bot'
          git config user.email 'preview-bot@users.noreply.github.com'
          git add public/resin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore exact working static Resin template'
          git push origin HEAD:${{ github.head_ref }}
