name: Verify live React 3D Resin hero

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live React page and diagnostics
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            fs.mkdirSync('evidence', { recursive: true });
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              reducedMotion: 'no-preference',
              recordVideo: { dir: 'evidence/video', size: { width: 1440, height: 900 } },
            });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleMessages = [];
            const responses = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));
            page.on('console', (msg) => consoleMessages.push(`${msg.type()}: ${msg.text()}`));
            page.on('response', (response) => {
              if (response.status() >= 400 || response.url().includes('/resin/') || response.url().includes('dealer-preview-data')) {
                responses.push({ status: response.status(), url: response.url() });
              }
            });

            await page.goto('https://platrik-preview-hub.vercel.app/stoneflow-resin/?verify=react-3d-bootstrap', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(8000);
            await page.screenshot({ path: 'evidence/bootstrap.png' });

            const bootstrap = await page.evaluate(() => ({
              url: location.href,
              title: document.title,
              frames: window.frames.length,
              bodyText: document.body.innerText.slice(0, 1500),
              bodyHtml: document.body.innerHTML.slice(0, 4000),
              hasScene: Boolean(document.querySelector('.driveway-scene')),
              hasRoot: Boolean(document.getElementById('root')),
              scripts: [...document.scripts].map((script) => script.src || '[inline]'),
              styles: [...document.querySelectorAll('link[rel="stylesheet"]')].map((link) => link.href),
            }));
            fs.writeFileSync('evidence/bootstrap-report.json', JSON.stringify({ bootstrap, pageErrors, consoleMessages, responses }, null, 2));

            await context.close();
            await browser.close();
          })().catch((error) => {
            fs.writeFileSync('evidence/workflow-error.txt', String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-react-3d-resin-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 1
