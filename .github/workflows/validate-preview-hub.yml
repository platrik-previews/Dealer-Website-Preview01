name: Validate Preview Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Preview Hub
        run: npm run build

      - name: Validate renderers and engagement tracking
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';

          const required = [
            'dist/index.html',
            'dist/preview-tracking.js',
            'dist/resin/index.html',
            'dist/resin/full-site.css',
            'dist/resin/full-site.js',
            'dist/resin/assets/App-DFtM7B0N.js',
            'dist/resin/assets/index-DaTgjokv.js',
            'dist/resin/assets/index-B01mJXAv.css',
            'dist/resin/assets/favicon-09JzxaOU.svg',
          ];
          for (const path of required) {
            if (!existsSync(path)) throw new Error(`Required Preview Hub file is missing: ${path}`);
          }

          const dealershipHtml = readFileSync('dist/index.html', 'utf8');
          const resinHtml = readFileSync('dist/resin/index.html', 'utf8');
          const fullSite = readFileSync('dist/resin/full-site.js', 'utf8');
          const fullSiteCss = readFileSync('dist/resin/full-site.css', 'utf8');
          const tracking = readFileSync('dist/preview-tracking.js', 'utf8');
          const resinScripts = readdirSync('dist/resin/assets')
            .filter((name) => name.endsWith('.js'))
            .map((name) => readFileSync(join('dist/resin/assets', name), 'utf8'))
            .join('\n');
          const resinCss = readFileSync('dist/resin/assets/index-B01mJXAv.css', 'utf8');
          const sourceDispatcher = readFileSync('src/main.jsx', 'utf8');

          if (!dealershipHtml.includes('/preview-tracking.js')) throw new Error('Dealership engagement tracking is missing.');
          if (!resinHtml.includes('/preview-tracking.js')) throw new Error('Resin engagement tracking is missing.');
          for (const marker of ["send('engaged')", "send('visited')", '8000', "credentials: 'omit'", 'keepalive: true']) {
            if (!tracking.includes(marker)) throw new Error(`Preview engagement marker is missing: ${marker}`);
          }
          for (const forbidden of ['document.cookie', 'localStorage', 'fingerprint']) {
            if (tracking.includes(forbidden)) throw new Error(`Privacy-forbidden tracker behavior is present: ${forbidden}`);
          }
          if (!sourceDispatcher.includes("params.set('pt', engagementToken)")) throw new Error('Resin handoff does not preserve the opaque engagement token.');

          if (!resinHtml.includes('noindex, nofollow, noarchive')) throw new Error('React Resin renderer is missing noindex.');
          if (!resinHtml.includes('react-3d-full-site-20260807')) throw new Error('Full Resin website build marker is missing.');
          if (!resinHtml.includes('/resin/full-site.css')) throw new Error('Full-site stylesheet is not loaded.');
          if (!resinHtml.includes('/resin/full-site.js')) throw new Error('Full-site runtime is not loaded.');
          if (!resinHtml.includes('window.history.replaceState')) throw new Error('Short public URL restoration is missing.');
          for (const marker of ['driveway-scene', 'A driveway should feel', 'Beautiful above', 'Lenis', 'Runtime configuration returned HTTP', 'const React=v;']) {
            if (!resinScripts.includes(marker)) throw new Error(`Verified React Resin marker is missing: ${marker}`);
          }
          for (const marker of ['preserve-3d', 'perspective']) {
            if (!resinCss.includes(marker)) throw new Error(`React Resin 3D styling is missing: ${marker}`);
          }
          for (const marker of ["'services'", "'projects'", "'process'", "'finishes'", "'about'", "'areas'", "'faq'", "'contact'", 'data-fs-form', 'data-fs-swatch']) {
            if (!fullSite.includes(marker)) throw new Error(`Full-site route or interaction is missing: ${marker}`);
          }
          for (const marker of ['.fs-header', '.fs-project-grid', '.fs-contact-grid', '@media (max-width: 760px)']) {
            if (!fullSiteCss.includes(marker)) throw new Error(`Responsive full-site styling is missing: ${marker}`);
          }
          if (!sourceDispatcher.includes("const RESIN_BUILD_ID = 'react-3d-full-site-20260807'")) throw new Error('Dispatcher build ID is stale.');
          if (!sourceDispatcher.includes("window.location.pathname.split('/').filter(Boolean)")) throw new Error('Nested public Resin routes are not preserved.');
          if (existsSync('dist/resin/script.js') || existsSync('dist/resin/runtime-config.js') || existsSync('dist/resin/styles.css')) {
            throw new Error('The obsolete flat static Resin prototype is still present.');
          }
          if (resinHtml.includes('BUILT IN LAYERS')) throw new Error('The obsolete flat layer-stack prototype is still embedded.');

          const hubScripts = readdirSync('dist/assets')
            .filter((name) => name.endsWith('.js'))
            .map((name) => readFileSync(join('dist/assets', name), 'utf8'))
            .join('\n');
          if (!hubScripts.includes('/resin/index.html?')) throw new Error('Short root Resin route handoff is missing.');
          if (!hubScripts.includes('window.location.replace')) throw new Error('Resin does not run as the top-level document.');
          if (!hubScripts.includes('react-3d-full-site-20260807')) throw new Error('The dispatcher is missing the full-site Resin build ID.');
          if (hubScripts.includes('<iframe')) throw new Error('Legacy iframe Resin rendering is still present.');

          console.log('Validated dealership renderer, preserved Resin 3D homepage, responsive full-site routes, engagement tracking, privacy safeguards and noindex.');
          NODE
