name: Validate Preview Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Preview Hub
        run: npm run build

      - name: Validate dealership and exact static Resin renderers
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';

          const required = [
            'dist/index.html',
            'dist/resin/index.html',
            'dist/resin/styles.css',
            'dist/resin/script.js',
            'dist/resin/runtime-config.js',
            'dist/resin/favicon.svg',
          ];
          for (const path of required) {
            if (!existsSync(path)) throw new Error(`Required Preview Hub file is missing: ${path}`);
          }

          const resinHtml = readFileSync('dist/resin/index.html', 'utf8');
          if (!resinHtml.includes('A better first impression')) throw new Error('The exact original Resin hero is missing.');
          if (!resinHtml.includes('BUILT IN LAYERS')) throw new Error('The exact original Resin animation markup is missing.');
          if (!resinHtml.includes('noindex, nofollow, noarchive')) throw new Error('Resin renderer is missing noindex.');
          if (!resinHtml.includes('/resin/styles.css?v=static-original-20260728')) throw new Error('Original static Resin stylesheet is not referenced.');
          if (!resinHtml.includes('/resin/script.js?v=static-original-20260728')) throw new Error('Original static Resin script is not referenced.');
          if (!resinHtml.includes('/resin/runtime-config.js?v=static-original-20260728')) throw new Error('Runtime JSON adapter is not referenced.');
          if (resinHtml.includes('/resin/assets/index-')) throw new Error('A reconstructed React Resin asset is still referenced.');

          const originalScript = readFileSync('dist/resin/script.js', 'utf8');
          if (!originalScript.includes('[data-hero]')) throw new Error('Original Resin interaction script is incomplete.');

          const runtime = readFileSync('dist/resin/runtime-config.js', 'utf8');
          if (!runtime.includes('dealer-preview-data/main/leads/')) throw new Error('Runtime JSON data source is missing.');
          if (!runtime.includes('config.companyName')) throw new Error('Business-name personalization is missing.');
          if (!runtime.includes('config.logoUrl')) throw new Error('Logo personalization is missing.');
          if (!runtime.includes('original static site remains visible')) throw new Error('Fail-open rendering protection is missing.');

          const hubScripts = readdirSync('dist/assets')
            .filter((name) => name.endsWith('.js'))
            .map((name) => readFileSync(join('dist/assets', name), 'utf8'))
            .join('\n');
          if (!hubScripts.includes('/resin/index.html?slug=')) throw new Error('Short root Resin route dispatcher is missing.');
          if (!hubScripts.includes('static-original-20260728')) throw new Error('Root Resin route is missing the static build cache ID.');

          console.log('Validated dealership behavior, exact original static Resin template, JSON personalization and noindex.');
          NODE
