name: Validate Preview Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Preview Hub
        run: npm run build

      - name: Validate dealership and resin renderers
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          if (!existsSync('dist/index.html')) throw new Error('Preview Hub index is missing.');
          if (!existsSync('dist/resin/index.html')) throw new Error('Resin renderer index is missing.');
          const resinHtml = readFileSync('dist/resin/index.html', 'utf8');
          if (!resinHtml.includes('noindex, nofollow, noarchive')) throw new Error('Resin renderer is missing noindex.');
          if (!resinHtml.includes('index-current-20260728.js')) throw new Error('Resin renderer is not using the current versioned runtime.');
          const hubScripts = readdirSync('dist/assets').filter((name) => name.endsWith('.js')).map((name) => readFileSync(join('dist/assets', name), 'utf8')).join('\n');
          if (!hubScripts.includes('/resin/index.html?slug=')) throw new Error('Root resin route dispatcher is missing.');
          if (!hubScripts.includes('current-20260728')) throw new Error('Root resin route is missing its cache-busting build ID.');
          const resinScripts = readdirSync('dist/resin/assets').filter((name) => name.endsWith('.js')).map((name) => readFileSync(join('dist/resin/assets', name), 'utf8')).join('\n');
          if (!resinScripts.includes('Runtime configuration returned HTTP')) throw new Error('Resin runtime JSON loader is missing.');
          if (!resinScripts.includes('A driveway should feel')) throw new Error('Current Resin hero copy is missing; a stale template was embedded.');
          if (!resinScripts.includes('Beautiful above.')) throw new Error('Current Resin final hero copy is missing; visual parity failed.');
          if (resinScripts.includes('Thoughtfully designed')) throw new Error('Legacy Resin hero copy is still embedded.');
          console.log('Validated dealership behavior, current Resin visual parity, runtime JSON and noindex.');
          NODE
